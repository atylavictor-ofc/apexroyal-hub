<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ApexRoyal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--card:#151516;--tx:#f2f0ea;--mut:#9a9a9f;--ac:#d4af37;--acs:#2a2412;--bd:#262628;--on:#0b0b0c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
:root[data-theme="bw"]{--ac:#ffffff;--acs:#232325}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5}
.w{max-width:960px;margin:0 auto;padding:24px 20px 48px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding-bottom:20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:.2px}
.mk{width:30px;height:30px;border-radius:7px;background:var(--ac);color:var(--on);display:grid;place-items:center;font-size:14px;font-weight:700}
.who{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px;flex-wrap:wrap}
select,button,input{font:inherit;font-size:14px;padding:9px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
input:focus,select:focus{outline:none;border-color:var(--ac)}
nav{display:flex;gap:28px;border-bottom:1px solid var(--bd);margin-bottom:24px}
nav button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px 0;color:var(--mut);cursor:pointer;font-weight:500;margin-bottom:-1px}
nav button.on{color:var(--tx);border-bottom-color:var(--ac)}
h2{font-size:20px;font-weight:600;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 20px;font-size:14px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px}
.pl{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.av{width:48px;height:48px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-weight:600;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.ph{margin-top:12px;font-size:13px;color:var(--mut)}
.ph label{color:var(--ac);cursor:pointer;font-weight:500}
.tg{display:flex;border:1px solid var(--bd);border-radius:99px;padding:3px;gap:2px;background:var(--card)}
.tg button{border:0;background:none;width:34px;height:28px;border-radius:99px;padding:0;color:var(--mut);cursor:pointer;display:grid;place-items:center}
.tg button svg{width:16px;height:16px}
.tg button.on{background:var(--ac);color:var(--on)}
.row2{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.ag{width:28px;height:28px;border-radius:50%;background:var(--acs);vertical-align:middle;margin-right:8px;object-fit:cover}
span.ag{display:inline-grid;place-items:center;font-size:12px;font-weight:600;color:var(--ac)}
.nm{font-weight:600}
.m{color:var(--mut);font-size:13px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 0;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);margin-bottom:12px;text-align:center}
.st b{display:block;font-size:16px}
a{color:var(--ac);text-decoration:none;font-weight:500;font-size:14px}a:hover{text-decoration:underline}
.pill{display:inline-block;background:var(--acs);color:var(--ac);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.o{display:flex;align-items:center;gap:16px;margin-bottom:10px;padding:16px 18px;flex-wrap:wrap}
.o.sel{border-color:var(--ac)}
.o input{width:18px;height:18px;accent-color:var(--ac);padding:0}
.info{flex:1;min-width:150px}
.pr{background:var(--ac);color:var(--on);border-color:var(--ac);cursor:pointer;font-weight:600;padding:10px 20px;margin-top:8px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:600;padding:8px 0;border-bottom:1px solid var(--bd)}
td{padding:10px 0;border-bottom:1px solid var(--bd);vertical-align:top}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lg{width:100%;max-width:360px}
.lg .logo{justify-content:center;margin-bottom:24px;font-size:20px}
.lg label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
.lg input{width:100%}
.lg .pr{width:100%;margin-top:22px}
.err{color:#e5645b;font-size:13px;min-height:20px;margin-top:12px;text-align:center}
.lk{text-align:center;color:var(--mut);font-size:12px;margin-top:16px}
.lgm{height:40px;width:auto;mix-blend-mode:lighten}
.lgf{width:min(300px,80vw);height:auto;mix-blend-mode:lighten}
body{background:radial-gradient(900px 420px at 50% -80px,rgba(212,175,55,.18),transparent 70%),radial-gradient(500px 300px at 100% 45%,rgba(212,175,55,.07),transparent 70%),var(--bg);background-attachment:fixed}
:root[data-theme="bw"] body{background:radial-gradient(900px 420px at 50% -80px,rgba(255,255,255,.10),transparent 70%),var(--bg);background-attachment:fixed}
h2,nav button,.nm,th,.hero h1,.pr{font-family:"Barlow Condensed",Inter,system-ui,sans-serif}
h2{font-size:28px;text-transform:uppercase;letter-spacing:1px;padding-left:12px;border-left:4px solid var(--ac);line-height:1.1;margin-bottom:8px}
.sub{padding-left:16px}
nav{gap:6px;background:var(--card);border:1px solid var(--bd);padding:5px;border-radius:12px}
nav button{flex:1;margin:0;padding:10px 6px;border-radius:8px;text-transform:uppercase;letter-spacing:1.5px;font-size:16px;font-weight:600}
nav button.on{background:var(--ac);color:var(--on);box-shadow:0 0 18px -4px var(--ac)}
.c{background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--ac),transparent 45%,var(--bd)) border-box;border:1px solid transparent;transition:transform .2s,box-shadow .2s}
.g .c:hover{transform:translateY(-3px);box-shadow:0 10px 30px -12px var(--ac)}
.av{box-shadow:0 0 0 2px var(--ac)}
.pr{box-shadow:0 0 22px -6px var(--ac);text-transform:uppercase;letter-spacing:1.5px;font-size:17px}
#login .c{box-shadow:0 0 60px -22px var(--ac)}
.hero{position:relative;overflow:hidden;border-radius:16px;padding:30px 24px;margin-bottom:22px;border:1px solid var(--bd);background:linear-gradient(110deg,var(--card) 35%,rgba(212,175,55,.16))}
:root[data-theme="bw"] .hero{background:linear-gradient(110deg,var(--card) 35%,rgba(255,255,255,.09))}
.hero h1{position:relative;margin:0;font-size:clamp(36px,8vw,60px);letter-spacing:4px;text-transform:uppercase;line-height:1;font-weight:700}
.hero h1 span{color:var(--ac)}
.hero p{position:relative;margin:8px 0 0;color:var(--mut);letter-spacing:3px;text-transform:uppercase;font-size:13px}
.hero img{position:absolute;right:-10px;top:50%;transform:translateY(-50%);height:140%;opacity:.6;mix-blend-mode:lighten;pointer-events:none}
.hero::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,var(--ac),transparent)}
.soc{display:flex;gap:6px}
.soc a{width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;color:var(--mut);background:var(--card);transition:.2s}
.soc a[href]:hover{color:var(--ac);border-color:var(--ac);box-shadow:0 0 14px -4px var(--ac)}
.soc a.off{opacity:.45}
.soc svg{width:16px;height:16px;fill:currentColor}
nav{overflow-x:auto}nav button{white-space:nowrap;padding:10px 14px}
textarea:focus{outline:none;border-color:var(--ac)}
[hidden]{display:none!important}
#tc{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;left:14px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:50;pointer-events:none}
.ts{background:var(--card);border:1px solid var(--ac);color:var(--tx);padding:11px 16px;border-radius:10px;box-shadow:0 8px 30px -8px var(--ac);font-weight:500;max-width:340px;animation:ti .25s ease-out;display:flex;gap:10px;align-items:center}
.ts::before{content:"✓";color:var(--on);background:var(--ac);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.ts.bad{border-color:#e5645b;box-shadow:0 8px 30px -8px #e5645b}.ts.bad::before{content:"!";background:#e5645b;color:#fff}
.ts.out{opacity:0;transform:translateY(-8px);transition:.3s}
@keyframes ti{from{opacity:0;transform:translateY(-10px)}}
#ld{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-content:center;justify-items:center;gap:18px}
#ld img{width:min(260px,60vw);mix-blend-mode:lighten;animation:pl2 1.2s ease-in-out infinite}
@keyframes pl2{50%{transform:scale(1.06);filter:drop-shadow(0 0 24px var(--ac))}}
#ld .bar{width:200px;height:4px;background:var(--bd);border-radius:99px;overflow:hidden}
#ld .bar i{display:block;height:100%;width:0;background:var(--ac);animation:ldb 1.3s ease-in-out forwards}
@keyframes ldb{to{width:100%}}
#ld p{margin:0;color:var(--mut);letter-spacing:3px;text-transform:uppercase;font-size:13px}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.dash>h2,.dash>.sub{grid-column:1/-1;margin:0}
.dash>.c{margin:0!important}
.dash>.c:nth-child(3){grid-column:1/-1}
.dash>.c:nth-child(5){grid-column:1/-1;order:2}
@media(max-width:700px){.dash{grid-template-columns:1fr}}
.chip{border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer}.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.g{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.g .c{text-align:center;padding:24px 18px 18px;position:relative;overflow:hidden}
.g .c::before{content:"";position:absolute;inset:0 0 auto 0;height:80px;background:linear-gradient(180deg,rgba(212,175,55,.24),transparent);pointer-events:none}
:root[data-theme="bw"] .g .c::before{background:linear-gradient(180deg,rgba(255,255,255,.12),transparent)}
.g .pl{flex-direction:column;gap:10px;position:relative}
.g .av{width:88px;height:88px;font-size:34px;box-shadow:0 0 0 3px var(--ac),0 0 26px -4px var(--ac)}
.g .nm{font-size:22px;letter-spacing:.5px}
.g a{display:block;margin-top:14px;padding:9px;border:1px solid var(--bd);border-radius:8px;position:relative}
.g a:hover{border-color:var(--ac);text-decoration:none}
.g .ph a{display:inline;border:0;padding:0;margin:0}
#login{position:relative;overflow:hidden}
#lbg{position:absolute;width:min(900px,140vw);left:50%;top:50%;transform:translate(-50%,-50%);opacity:.13;mix-blend-mode:lighten;pointer-events:none;animation:pl 6s ease-in-out infinite}
@keyframes pl{50%{opacity:.24;transform:translate(-50%,-50%) scale(1.05)}}
.lg{position:relative;z-index:1}
#login .c{background:linear-gradient(rgba(18,18,19,.82),rgba(18,18,19,.82)) padding-box,linear-gradient(135deg,var(--ac),transparent 50%,var(--bd)) border-box;backdrop-filter:blur(10px);padding:26px 22px}
</style>
</head>

delH=function(i){run(SB.from("historico").delete().eq("id",D.hist[i].id),"Partida removida");return false};
addO=function(){var m=$("om").value.trim(),d=$("od").value,a=$("o1").value,b=$("o2").value;if(!m||!d||!a||!b)return;run(SB.from("enquete_jogos").insert({mapa:m,dia:d,inicio:a,fim:b}),"Jogo adicionado \u00e0 enquete")};
delO=function(i){run(SB.from("enquete_jogos").delete().eq("id",opts[i].id),"Jogo removido da enquete");return false};
newWk=function(){var b=$("nwb");if(!b.dataset.c){b.dataset.c=1;b.textContent="Clique de novo para confirmar";setTimeout(function(){b.dataset.c="";b.textContent="Nova semana (apaga jogos e votos)"},4000);return}run(SB.from("enquete_jogos").delete().neq("id","00000000-0000-0000-0000-000000000000"),"Nova semana iniciada")};
setR=function(){var m=+$("rm").value;if(!m)return;run(SB.from("ranking").update({divisao:$("rd").value.trim()||"-",pontos:+$("rp").value||0,meta:m}).eq("id",1),"Ranking atualizado")};
zv=function(){var b=$("zvb");if(!b.dataset.c){b.dataset.c=1;b.textContent="Clique de novo para confirmar";setTimeout(function(){b.dataset.c="";b.textContent="Zerar votos da semana"},4000);return}run(SB.from("votos").delete().neq("user_id","00000000-0000-0000-0000-000000000000"),"Votos da semana zerados")};
